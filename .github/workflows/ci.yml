name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m compileall -q droid_mcp.py console.py
      - run: python -m pytest -q
      - name: docs/TOOLS.md 与代码一致（--dump-tools-md 生成，改工具记得刷）
        run: |
          python droid_mcp.py --dump-tools-md > /tmp/TOOLS.check.md
          diff -q /tmp/TOOLS.check.md docs/TOOLS.md
