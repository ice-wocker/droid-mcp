name: Companion CI

# 构建的是 companion/ 子目录里的 droid-mcp-companion 项目。
# v1 发布的 companion APK 就是 debug 签名（文件名带 debug 标识）。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # 版本由 companion 内的 Gradle Wrapper 决定；该 action 同时负责依赖缓存

      # ubuntu-latest 已预装 Android SDK；这里只补齐项目需要的 platform/build-tools。
      # 注意：不要用 android-actions/setup-android，它会执行 `sdkmanager tools`，
      # 而新版 cmdline-tools 已移除该 package，会导致步骤失败。
      # 本项目是纯 Java、无原生库，所以不需要 NDK 与 CMake。
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "使用 SDK: $SDK"
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: companion/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 仅在推送 v* 标签时自动发布 Release（debug 签名，文件名带 debug 标识）
      - name: Rename debug APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "droid-mcp-companion-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: companion/droid-mcp-companion-*-debug.apk
          generate_release_notes: true
          draft: false
          body: |
            droid-mcp companion ${{ github.ref_name }}（debug 签名）。

            注意：此 APK 为 debug 签名（v1 发布策略）。覆盖安装时若签名冲突，
            请先卸载旧版本再重装。
