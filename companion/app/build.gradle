plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.icewocker.droidmcp'
    compileSdk 34

    defaultConfig {
        applicationId "com.icewocker.droidmcp"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.3.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// 零第三方依赖：只有 Android 框架 + org.json + JUnit（测试）。
dependencies {
    testImplementation libs.junit
}
